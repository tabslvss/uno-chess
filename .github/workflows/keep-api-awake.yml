# Render free tier sleeps after ~15 min with no traffic. Ping every 10 min so online play stays instant.
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping game server health
        run: curl -fsS --max-time 30 https://unochess-api.onrender.com/health
